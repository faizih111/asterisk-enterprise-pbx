[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Template for Production Endpoints (NAT & Codec Best Practices) ---
[endpoint-template](!)
type=endpoint
context=internal
disallow=all
allow=ulaw,alaw
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
max_contacts=1
qualify_frequency=30

; --- Extension 1001 (Sales Agent 1) ---
[1001](endpoint-template)
auth=1001-auth
aors=1001
callerid="Sales Agent 1" <1001>

[1001-auth](auth-template)
username=1001
password=CHANGE_ME_1001

[1001](aor-template)

; --- Extension 1002 (Support Agent 1) ---
