[internal]
; --- 1. Echo Test & System Check ---
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; --- 2. Internal Extension-to-Extension Calls (1001, 1002, 1003) ---
exten => _100X,1,NoOp(Internal Call from ${CALLERID(num)} to ${EXTEN})
 same => n,MixMonitor(/var/spool/asterisk/monitor/internal-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-to-${EXTEN}.wav)
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

; --- 3. Voicemail Portal (*98) ---
exten => *98,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; --- 4. Main Company Helpline with Time-Based Routing (Dial 500) ---
exten => 500,1,NoOp(Incoming Call to Company Helpline)
 same => n,Answer()
 ; Office Hours: Mon-Fri, 09:00 to 18:00 (Agar time match ho toh IVR par bhejo)
 same => n,GotoIfTime(09:00-18:00,mon-sun,*,*?ivr-menu,s,1)
 ; After Hours (Raat ya Weekend par seedha Voicemail)
 same => n,Playback(vm-nobodyavail)
 same => n,VoiceMail(1003@default,u)
 same => n,Hangup()

; --- 5. Multi-Department IVR Menu ---
[ivr-menu]
exten => s,1,Background(demo-instruct)
 same => n,WaitExten(10)

; Press 1: Sales Ring Group (1001 aur 1003 ek saath bajenge + Recording)
exten => 1,1,NoOp(Routing to Sales Ring Group)
 same => n,MixMonitor(/var/spool/asterisk/monitor/sales-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}.wav)
 same => n,Dial(PJSIP/1001&PJSIP/1003,20)
 same => n,VoiceMail(1001@default,u)
 same => n,Hangup()

; Press 2: Technical Support Call Queue (Hold Music ke saath)
exten => 2,1,NoOp(Routing to Support Call Queue)
 same => n,MixMonitor(/var/spool/asterisk/monitor/support-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}.wav)
 same => n,Queue(support-queue,,,60)
 same => n,VoiceMail(1002@default,u)
 same => n,Hangup()

; Press 0: Direct Operator / Manager (1003)
exten => 0,1,NoOp(Routing to Operator)
 same => n,Dial(PJSIP/1003,20)
 same => n,VoiceMail(1003@default,u)
 same => n,Hangup()

; Invalid ya Timeout handling
exten => i,1,Playback(pbx-invalid)
 same => n,Goto(ivr-menu,s,1)

exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()
